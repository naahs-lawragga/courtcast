name: CourtCast security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript and security configuration
        run: |
          node --check courtcast-app.js
          node --check courtcast-security.js
          node tests/security.test.mjs
          node tests/source-scan.mjs
      - name: Audit pinned runtime libraries
        run: |
          AUDIT_DIR="$(mktemp -d)"
          cd "$AUDIT_DIR"
          npm init -y --silent >/dev/null
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact peerjs@1.5.5 qrcodejs@1.0.0 tesseract.js@5.1.1 tesseract.js-core@5.1.1
          npm audit --omit=dev --audit-level=high
